<!doctype html>
<html lang="pt-BR" data-theme="oceano">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Vitrine Admin</title>
  <meta name="description" content="Painel administrativo e financeiro do e-commerce: faturamento por produto e período, pedidos, sellers, equipe e sistema.">
  <meta name="theme-color" content="#0b3d53">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontes da Apple (SF Pro) são usadas nativamente em macOS/iOS; Inter é o substituto em Windows, Android e Linux. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem('vitrine-admin:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
